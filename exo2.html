<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h2>Upload des fichiers</h2>

    <form action="/upload"
          method="POST"
          enctype="multipart/form-data">

        <label>Choisir des fichiers :</label>

        <input type="file" name="files" multiple required>

        <br><br>

        <button type="submit">
            Envoyer
        </button>

    </form>
</body>
